name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { python -m pip install -r requirements.txt } else { python -m pip install pytest flake8 }
      shell: pwsh

    - name: Run tests
      run: python -m pytest -q
      shell: pwsh

    - name: Run flake8
      run: flake8 .
      shell: pwsh